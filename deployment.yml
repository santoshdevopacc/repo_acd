apiVersion: apps/v1
kind: Deployment
metadata:
  name: uber
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uber
  template:
    metadata:
      labels:
        app: uber
    spec:
      containers:
      - name: container1
        image: santoshdevopacc/my_docker_repo:uber_v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ubersvc
spec:
  type: NodePort
  selector:
    app: uber
  ports:
    - port: 8080
      targetPort: 80
      nodePort: 30001
